<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="bg-light">
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="card shadow-lg p-4 rounded-4" style="width: 500px">
        <h1 class="text-center mb-4">My To-Do List</h1>

        <form class="d-flex gap-2 mb-4">
          <input
            type="text"
            class="form-control"
            placeholder="Add a new task.."
            id="input"
          />

          <button type="submit" class="submit-button btn btn-primary">
            Add
          </button>
        </form>

        <div id="tasks" class="containerdd d-flex flex-column gap-2">
          <div
            class="task d-flex justify-content-between align-items-center border rounded-3 p-3 mb-3"
          >
            <p>Learn JavaScript</p>

            <div>
              <button class="btn btn-success btn-sm me-2 edit-btn">
                Edit
              </button>

              <button class="btn btn-danger btn-sm delete-btn">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
